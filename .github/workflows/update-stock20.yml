name: Update Stock20 Data

on:
  schedule:
    # 11:15 UTC = 4:45 PM IST, Monday-Friday (market close ke baad)
    - cron: '15 11 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch latest stock data
        run: python scripts/update_stock20.py

      - name: Commit updated stock20.json
        run: |
          git config user.name "stock20-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stock20.json
          git diff --cached --quiet || git commit -m "Auto-update Stock20 data — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

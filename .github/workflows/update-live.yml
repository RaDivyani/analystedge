name: Update Live Prices

on:
  schedule:
    # Har 5 minute, 03:45–10:10 UTC = 9:15 AM – 3:40 PM IST, Monday–Friday
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch live prices
        run: python scripts/update_live.py

      - name: Commit live.json
        run: |
          git config user.name "live-price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet || git commit -m "Live prices — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin main || true
          git push
